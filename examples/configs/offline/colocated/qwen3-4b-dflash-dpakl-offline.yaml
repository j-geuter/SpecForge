model:
  target_model_path: Qwen/Qwen3-4B
  draft_model_config: configs/qwen3-4b-dflash-3l-b16.json
  torch_dtype: bfloat16

data:
  # All overlap objectives use the same four-field teacher cache.
  hidden_states_path: ./cache/hidden_states/qwen3-4b-dflash-dpard
  max_length: 3072
  chat_template: qwen

training:
  strategy: dflash
  loss_type: dpakl
  dpakl_alpha: 0.3
  num_epochs: 6
  batch_size: 1
  accumulation_steps: 2
  learning_rate: 6.0e-4
  lr_scheduler: cosine
  warmup_ratio: 0.04
  max_grad_norm: 1.0
  attention_backend: flex_attention
  num_anchors: 512
  objective_chunk_blocks: 128
  save_interval: 1000
  log_interval: 50
  seed: 42

run_id: qwen3-4b-dflash-dpakl-b16
output_dir: ./outputs/qwen3-4b-dflash-dpakl-b16

deployment:
  mode: local_colocated
  trainer:
    nnodes: 1
    nproc_per_node: 2
